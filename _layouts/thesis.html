---
layout: default
---
<div class="container container-narrow" style="padding-top: 3rem;">
  <article class="thesis-entry">
    <header class="article-header">
      <p class="eyebrow">{% if site.active_lang == 'de' %}Diplomarbeit{% else %}Thesis{% endif %}</p>
      <h1>{{ page.title }}</h1>
      <p class="article-meta">
        <span><i class="fas fa-user-graduate" aria-hidden="true"></i>{{ page.student }}</span>
        <span><i class="far fa-calendar" aria-hidden="true"></i>{{ page.year }}</span>
      </p>
    </header>

    {% if page.project_url %}
    <p><strong>{% if site.active_lang == 'de' %}Projekt{% else %}Project{% endif %}:</strong> <a href="{{ page.project_url }}">{{ page.project_url }}</a></p>
    {% endif %}

    <div class="article-body">
      {{ content }}
    </div>
  </article>
</div>
